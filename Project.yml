name: Clip

options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release
  AppStoreDebug: debug
  AppStoreRelease: release

packages:
  ReelAppCore:
    path: App/Reel
  DesignSystem:
    path: Packages/DesignSystem
  LibraryStore:
    path: Packages/LibraryStore
  CaptureKit:
    path: Packages/CaptureKit
  ConvertKit:
    path: Packages/ConvertKit
  MediaEngine:
    path: Packages/MediaEngine
  PDFEngine:
    path: Packages/PDFEngine
  AIKit:
    path: Packages/AIKit
  SearchEngine:
    path: Packages/SearchEngine

targets:
  Clip:
    type: application
    platform: macOS
    sources:
      - path: App/Reel/Sources/Reel
    info:
      path: App/Reel/Config/Info.plist
      properties:
        CFBundleDisplayName: Clip
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.video
        NSDesktopFolderUsageDescription: Clip watches your macOS screenshot folder while the app is open so new screenshots and screen recordings can be imported automatically.
        NSSpeechRecognitionUsageDescription: Clip uses on-device speech recognition to generate captions for your clips.
    dependencies:
      - package: ReelAppCore
        product: ReelAppCore
      - package: DesignSystem
      - package: LibraryStore
      - package: CaptureKit
      - package: ConvertKit
      - package: MediaEngine
      - package: PDFEngine
      - package: AIKit
      - package: SearchEngine
    configFiles:
      Debug: App/Reel/Config/xcconfig/Debug.xcconfig
      Release: App/Reel/Config/xcconfig/Release.xcconfig
      AppStoreDebug: App/Reel/Config/xcconfig/AppStoreDebug.xcconfig
      AppStoreRelease: App/Reel/Config/xcconfig/AppStoreRelease.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.reel.editor
        PRODUCT_NAME: Clip
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The final build phase must re-sign the bundled Tectonic executable.
        # Xcode's user-script sandbox otherwise prevents codesign from reading
        # the enclosing SwiftPM resource bundle.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Sign bundled Tectonic
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          if [[ "${CODE_SIGNING_ALLOWED:-NO}" == "NO" ]]; then
            exit 0
          fi

          RESOURCES_ROOT="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          TECTONIC_ENTITLEMENTS="$SRCROOT/App/Reel/Config/TectonicHelper.entitlements"
          if [[ ! -d "$RESOURCES_ROOT" ]]; then
            echo "error: Missing built resource directory at $RESOURCES_ROOT" >&2
            exit 1
          fi
          TECTONIC_PATH="$(/usr/bin/find "$RESOURCES_ROOT" -type f -path '*/TextEngine_TextEngine.bundle/*/Tectonic/tectonic' -print -quit)"
          if [[ -z "$TECTONIC_PATH" || ! -x "$TECTONIC_PATH" ]]; then
            echo "error: Unable to locate the executable bundled Tectonic tool below $RESOURCES_ROOT" >&2
            exit 1
          fi

          TEXT_ENGINE_BUNDLE="$(/usr/bin/dirname "$TECTONIC_PATH")"
          while [[ "${TEXT_ENGINE_BUNDLE##*/}" != "TextEngine_TextEngine.bundle" ]]; do
            PARENT_BUNDLE="$(/usr/bin/dirname "$TEXT_ENGINE_BUNDLE")"
            if [[ "$PARENT_BUNDLE" == "$TEXT_ENGINE_BUNDLE" || "$PARENT_BUNDLE" == "/" ]]; then
              echo "error: Tectonic is not inside TextEngine_TextEngine.bundle: $TECTONIC_PATH" >&2
              exit 1
            fi
            TEXT_ENGINE_BUNDLE="$PARENT_BUNDLE"
          done

          SIGNING_IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          /usr/bin/codesign --remove-signature "$TECTONIC_PATH" 2>/dev/null || true
          if [[ "${CONFIGURATION:-}" == AppStore* ]]; then
            if [[ ! -f "$TECTONIC_ENTITLEMENTS" ]]; then
              echo "error: Missing Tectonic helper entitlements at $TECTONIC_ENTITLEMENTS" >&2
              exit 1
            fi
            /usr/bin/codesign --force --options runtime --timestamp=none \
              --identifier "$PRODUCT_BUNDLE_IDENTIFIER.tectonic" \
              --entitlements "$TECTONIC_ENTITLEMENTS" \
              --sign "$SIGNING_IDENTITY" "$TECTONIC_PATH"
          else
            # The direct build is not sandboxed. Giving its child an inherited
            # sandbox signature causes macOS to abort the tool at launch.
            /usr/bin/codesign --force --options runtime --timestamp=none \
              --identifier "$PRODUCT_BUNDLE_IDENTIFIER.tectonic" \
              --sign "$SIGNING_IDENTITY" "$TECTONIC_PATH"
          fi
          /usr/bin/codesign --verify --strict "$TECTONIC_PATH"
          /usr/bin/codesign --force --timestamp=none --sign "$SIGNING_IDENTITY" "$TEXT_ENGINE_BUNDLE"

  ReelUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: App/Reel/UITests/ReelUITests
    dependencies:
      - target: Clip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.reel.editor.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Clip

schemes:
  Clip:
    build:
      targets:
        Clip: all
        ReelUITests: [test]
    test:
      config: Debug
      targets:
        - ReelUITests
    run:
      config: Debug
    archive:
      config: Release
  Clip-AppStore:
    build:
      targets:
        Clip: all
    run:
      config: AppStoreDebug
    archive:
      config: AppStoreRelease
