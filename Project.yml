name: Clip

options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release
  AppStoreDebug: debug
  AppStoreRelease: release

packages:
  ReelAppCore:
    path: App/Reel
  DesignSystem:
    path: Packages/DesignSystem
  LibraryStore:
    path: Packages/LibraryStore
  CaptureKit:
    path: Packages/CaptureKit
  ConvertKit:
    path: Packages/ConvertKit
  MediaEngine:
    path: Packages/MediaEngine
  PDFEngine:
    path: Packages/PDFEngine
  AIKit:
    path: Packages/AIKit
  SearchEngine:
    path: Packages/SearchEngine

targets:
  Clip:
    type: application
    platform: macOS
    sources:
      - path: App/Reel/Sources/Reel
    info:
      path: App/Reel/Config/Info.plist
      properties:
        CFBundleDisplayName: Clip
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.video
        NSDesktopFolderUsageDescription: Clip watches your macOS screenshot folder while the app is open so new screenshots and screen recordings can be imported automatically.
        NSSpeechRecognitionUsageDescription: Clip uses on-device speech recognition to generate captions for your clips.
    dependencies:
      - package: ReelAppCore
        product: ReelAppCore
      - package: DesignSystem
      - package: LibraryStore
      - package: CaptureKit
      - package: ConvertKit
      - package: MediaEngine
      - package: PDFEngine
      - package: AIKit
      - package: SearchEngine
    configFiles:
      Debug: App/Reel/Config/xcconfig/Debug.xcconfig
      Release: App/Reel/Config/xcconfig/Release.xcconfig
      AppStoreDebug: App/Reel/Config/xcconfig/AppStoreDebug.xcconfig
      AppStoreRelease: App/Reel/Config/xcconfig/AppStoreRelease.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.reel.editor
        PRODUCT_NAME: Clip
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ReelUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: App/Reel/UITests/ReelUITests
    dependencies:
      - target: Clip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.reel.editor.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Clip

schemes:
  Clip:
    build:
      targets:
        Clip: all
        ReelUITests: [test]
    test:
      config: Debug
      targets:
        - ReelUITests
    run:
      config: Debug
    archive:
      config: Release
  Clip-AppStore:
    build:
      targets:
        Clip: all
    run:
      config: AppStoreDebug
    archive:
      config: AppStoreRelease
