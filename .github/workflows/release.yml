name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  distribute:
    runs-on: macos-26
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: brew install xcodegen

      - name: Import distribution certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          certificate="$RUNNER_TEMP/distribution.p12"
          keychain="$RUNNER_TEMP/release.keychain-db"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db

      - name: Materialize App Store Connect key
        env:
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          key="$RUNNER_TEMP/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8"
          echo "$APP_STORE_CONNECT_KEY_BASE64" | base64 --decode > "$key"
          chmod 600 "$key"
          echo "NOTARY_KEY=$key" >> "$GITHUB_ENV"

      - name: Test, notarize, and upload both channels
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          NOTARY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          make test
          make release

      - uses: actions/upload-artifact@v4
        with:
          name: Reel-${{ github.ref_name }}
          path: ReleaseBuild/artifacts/*
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ReleaseBuild/artifacts/* --generate-notes --verify-tag
